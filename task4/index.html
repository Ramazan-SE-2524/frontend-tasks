<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4 - Table and Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="page-title">Students grades</h1>

    <table>
      <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Grade</th>
      </tr>
      <tr>
        <td rowspan="2">Ramazan</td>
        <td>Front-end</td>
        <td>95</td>
      </tr>

      <tr>
        <td>Database</td>
        <td>95</td>
      </tr>

      <tr class="highlight-row">
        <td>Nursultan</td>
        <td>Front-end</td>
        <td>96</td>
      </tr>
      <tr>
        <td>Daniyar</td>
        <td>Operating Systems</td>
        <td>87</td>
      </tr>
    </table>
    <form id="feedback-form">
      <h2>feedback</h2>

      <label for="name">Name</label>
      <input type="text" id="name" />

      <label for="email">Email</label>
      <input type="email" id="email" />

      <label for="role">Role</label>
      <select id="role">
        <option>Student</option>
        <option>Teacher</option>
        <option>Other</option>
      </select>

      <p class="question">Was this course useful?</p>
      <label><input type="radio" name="useful" />Yes</label>
      <label><input type="radio" name="useful" />No</label>

      <label for="comments">Comments</label>
      <textarea id="comments" rows="4"></textarea>

      <button type="submit">Send</button>
    </form>
  </body>
</html>
